        // Custom Hook to persist state in localStorage
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.log(error);
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.log(error);
                }
            };
            return [storedValue, setValue];
        }

                setProfile({ ...profile, currentWeight: weightNum });

                const loss = (profile.startWeight - weightNum).toFixed(1);
                
                // Bot reacts in chat to weight update

                    let reaction = "";
                    if (weightNum < profile.currentWeight) {
                        reaction = `🎉 Дорогая моя, ты взвесилась! ${weightNum} кг! Да у нас отвес! Минус ${Math.abs(profile.currentWeight - weightNum).toFixed(1)} кг за раз. Богиня! Танцуем ламбаду! 💃`;

                                        {/* Vitamins Section */}
                                        <div class="space-y-2">
                                            <h5 class="text-xs font-bold text-slate-700 flex items-center gap-1">
                                                💊 Рекомендуемые Нутрицевтики (обсуди с врачом):
                                            </h5>
                                            <div class="space-y-1.5">
                                                {analysisResult.vitamins.map((vit, i) => (
                                                    <div key={i} class="bg-indigo-50/30 p-2.5 rounded-lg border border-indigo-100/40">
                                                        <div class="flex justify-between items-center text-xs font-bold text-indigo-950">
                                                            <span>{vit.name}</span>
                                                            <span class="text-rose-500">{vit.dose}</span>
                                                        </div>
                                                        <p class="text-[10px] text-slate-600 mt-0.5">{vit.desc}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Food Recommendations */}
                                        <div class="grid grid-cols-2 gap-3 pt-2">
                                            <div class="bg-emerald-50/40 border border-emerald-100 rounded-xl p-3">
                                                <h6 class="font-bold text-emerald-900 text-xs flex items-center gap-1 mb-1.5">
                                                    💚 В корзину:
                                                </h6>
                                                <ul class="text-[10px] text-slate-700 space-y-1 list-disc pl-3">
                                                    {analysisResult.foodsToLove.map((f, i) => (
                                                        <li key={i}>{f}</li>
                                                    ))}
                                                </ul>
                                            </div>

                                            <div class="bg-rose-50/40 border border-rose-100 rounded-xl p-3">
                                                <h6 class="font-bold text-rose-900 text-xs flex items-center gap-1 mb-1.5">
                                                    🛑 Ограничить:
                                                </h6>
                                                <ul class="text-[10px] text-slate-700 space-y-1 list-disc pl-3">
                                                    {analysisResult.foodsToLimit.map((f, i) => (
                                                        <li key={i}>{f}</li>
                                                    ))}
                                                </ul>
                                            </div>
                                        </div>

                                        {/* Lyubochka Comment */}
                                        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 flex items-start gap-2.5">
                                            <span class="text-xl shrink-0">👵</span>
                                            <p class="text-xs text-amber-900 italic leading-snug">
                                                {analysisResult.comment}
                                            </p>
                                        </div>

                                        <p class="text-[8px] text-center text-slate-400">
                                            *Данный разбор носит рекомендательный характер на основе ИИ. Все назначения согласуйте с лечащим врачом.
                                        </p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 4. RECIPES AND PP CONSTRUCTOR */}
                        {activeTab === 'recipes' && (
                            <div class="space-y-4">
                                <div class="bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-100 rounded-2xl p-4 shadow-sm">
                                    <div class="flex gap-3">
                                        <div class="w-10 h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center shrink-0">
                                            <i data-lucide="soup" class="w-6 h-6"></i>
                                        </div>
                                        <div>
                                            <h3 class="font-bold text-slate-800 text-sm">Кулинарная Магия Любочки</h3>
                                            <p class="text-xs text-slate-600 mt-1">
                                                Напиши продукты, которые грустят в холодильнике, или загрузи фото продуктов. Я придумаю простое, невероятно вкусное ПП-блюдо, от которого не растут бока!
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                {/* Form Input */}
                                <div class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm space-y-4">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 mb-1.5">Напиши ингредиенты (через запятую):</label>
                                        <input 
                                            type="text"
                                            placeholder="например: курица, кабачок, чеснок..."
                                            value={recipeInput}
                                            onChange={(e) => setRecipeInput(e.target.value)}
                                            class="w-full text-xs p-3 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-400"
                                        />
                                    </div>

                                    {/* Simulated Camera Upload */}
                                    <div class="space-y-2">
                                        <span class="block text-xs font-bold text-slate-700">Или прикрепи фото продуктов/холодильника:</span>
                                        <div class="grid grid-cols-2 gap-2">
                                            <button 
                                                type="button"
                                                onClick={() => handlePhotoUpload('fridge')}
                                                class="border border-dashed border-slate-300 hover:border-amber-400 bg-slate-50/50 hover:bg-amber-50/20 rounded-xl p-2.5 text-center transition flex flex-col items-center justify-center gap-1.5"
                                            >
                                                <i data-lucide="camera" class="w-5 h-5 text-amber-600"></i>
                                                <span class="text-[10px] font-semibold text-slate-700">Скан холодильника (демо)</span>
                                            </button>
                                            <button 
                                                type="button"
                                                onClick={() => handlePhotoUpload('cottage')}
                                                class="border border-dashed border-slate-300 hover:border-amber-400 bg-slate-50/50 hover:bg-amber-50/20 rounded-xl p-2.5 text-center transition flex flex-col items-center justify-center gap-1.5"
                                            >
                                                <i data-lucide="image" class="w-5 h-5 text-amber-600"></i>
                                                <span class="text-[10px] font-semibold text-slate-700">Фото пачки творога (демо)</span>
                                            </button>
                                        </div>
                                        {recipePhoto && (
                                            <div class="bg-amber-50/40 border border-amber-100 rounded-lg p-2 flex items-center justify-between text-xs text-amber-900">
                                                <span class="flex items-center gap-1.5 font-medium">
                                                    <i data-lucide="image" class="w-4 h-4 text-amber-500"></i>
                                                    {recipePhoto}
                                                </span>
                                                <button onClick={() => { setRecipePhoto(null); setRecipeInput(''); setRecipeResult(null); }} class="text-rose-500 font-bold">Очистить</button>
                                            </div>
                                        )}
                                    </div>

                                    <button 
                                        onClick={handleGenerateRecipe}
                                        disabled={recipeLoading || (!recipeInput.trim() && !recipePhoto)}
                                        class="w-full bg-amber-500 hover:bg-amber-600 disabled:bg-slate-200 disabled:text-slate-400 text-white text-xs font-bold py-2.5 rounded-xl shadow-sm transition flex items-center justify-center gap-1.5"
                                    >
                                        {recipeLoading ? (
                                            <>
                                                <span class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span>
                                                Любочка листает кулинарную книгу...
                                            </>
                                        ) : (
                                            <>
                                                <i data-lucide="cooking-pot" class="w-4 h-4"></i>
                                                Придумать ПП Рецепт
                                            </>
                                        )}
                                    </button>
                                </div>

                                {/* Recipe Result Panel */}
                                {recipeResult && (
                                    <div class="bg-white border-2 border-amber-100 rounded-2xl p-4 shadow-md space-y-4 animate-fade-in">
                                        <div class="border-b border-slate-100 pb-3">
                                            <span class="text-[10px] uppercase font-bold text-amber-600 tracking-wider">Идеальный рецепт для похудения:</span>
                                            <h4 class="font-bold text-slate-800 text-sm mt-0.5">{recipeResult.title}</h4>
                                            <div class="flex gap-4 mt-2 text-[10px] text-slate-500">
                                                <span class="flex items-center gap-0.5"><i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400"></i> {recipeResult.time}</span>
                                                <span class="flex items-center gap-0.5"><i data-lucide="flame" class="w-3.5 h-3.5 text-amber-500"></i> {recipeResult.calories}</span>
                                            </div>
                                        </div>

                                        {/* Ingredients */}
                                        <div class="space-y-1.5">
                                            <h5 class="text-xs font-bold text-slate-700">🥦 Ингредиенты:</h5>
                                            <ul class="text-xs text-slate-600 pl-3 list-disc space-y-1">
                                                {recipeResult.ingredients.map((ing, i) => (
                                                    <li key={i}>{ing}</li>
                                                ))}
                                            </ul>
                                        </div>

                                        {/* Steps */}
                                        <div class="space-y-2">
                                            <h5 class="text-xs font-bold text-slate-700">👩‍🍳 Процесс приготовления:</h5>
                                            <ol class="text-xs text-slate-600 pl-4 list-decimal space-y-1.5">
                                                {recipeResult.steps.map((step, i) => (
                                                    <li key={i} class="pl-1 leading-relaxed">{step}</li>
                                                ))}
                                            </ol>
                                        </div>

                                        {/* Recipe Joke / Comment */}
                                        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 flex items-start gap-2.5">
                                            <span class="text-xl shrink-0">👴</span>
                                            <p class="text-xs text-amber-900 italic leading-snug">
                                                "{recipeResult.joke}"
                                            </p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 5. PROFILE & WEIGHT SETTINGS */}
                        {activeTab === 'profile' && (
                            <div class="space-y-4">
                                <div class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm space-y-4">
                                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5 border-b border-slate-100 pb-2">
                                        <i data-lucide="user" class="text-rose-500 w-5 h-5"></i>
                                        Личный кабинет Богини
                                    </h3>
                                    
                                    <div class="space-y-3">
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-500 mb-1">Как тебя называть?</label>
                                            <input 
                                                type="text" 
                                                value={profile.name} 
                                                onChange={(e) => setProfile({...profile, name: e.target.value})}
                                                class="w-full text-xs p-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-400"
                                            />
                                        </div>

                                        <div class="grid grid-cols-2 gap-3">
                                            <div>
                                                <label class="block text-xs font-semibold text-slate-500 mb-1">Возраст (лет)</label>
                                                <input 
                                                    type="number" 
                                                    value={profile.age} 
                                                    onChange={(e) => setProfile({...profile, age: parseInt(e.target.value)})}
                                                    class="w-full text-xs p-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label class="block text-xs font-semibold text-slate-500 mb-1">Норма воды (стаканов)</label>
                                                <input 
                                                    type="number" 
                                                    value={profile.waterGoal} 
                                                    onChange={(e) => setProfile({...profile, waterGoal: parseInt(e.target.value)})}
                                                    class="w-full text-xs p-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none"
                                                />
                                            </div>
                                        </div>

                                        <div class="grid grid-cols-3 gap-3">
                                            <div>
                                                <label class="block text-xs font-semibold text-slate-500 mb-1">Старт (кг)</label>
                                                <input 
                                                    type="number" 
                                                    value={profile.startWeight} 
                                                    onChange={(e) => setProfile({...profile, startWeight: parseFloat(e.target.value)})}
                                                    class="w-full text-xs p-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label class="block text-xs font-semibold text-slate-500 mb-1">Сейчас (кг)</label>
                                                <input 
                                                    type="number" 
                                                    value={profile.currentWeight} 
                                                    disabled
                                                    class="w-full text-xs p-2.5 bg-slate-100 text-slate-500 rounded-xl border border-slate-200"
                                                />
                                            </div>
                                            <div>
                                                <label class="block text-xs font-semibold text-slate-500 mb-1">Цель (кг)</label>
                                                <input 
                                                    type="number" 
                                                    value={profile.targetWeight} 
                                                    onChange={(e) => setProfile({...profile, targetWeight: parseFloat(e.target.value)})}
                                                    class="w-full text-xs p-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none"
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <div class="flex justify-between items-center mb-1">
                                                <label class="block text-xs font-semibold text-slate-500">Уровень вредности характера Любочки</label>
                                                <span class="text-xs font-bold text-rose-500">{profile.characterLevel} из 10</span>
                                            </div>
                                            <input 
                                                type="range" 
                                                min="1" 
                                                max="10" 
                                                value={profile.characterLevel} 
                                                onChange={(e) => setProfile({...profile, characterLevel: parseInt(e.target.value)})}
                                                class="w-full accent-rose-500 cursor-pointer"
                                            />
                                            <div class="flex justify-between text-[10px] text-slate-400 mt-1">
                                                <span>Мягкая фея 🧚‍♀️</span>
                                                <span>Железная леди ⚔️</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* DETAILED HISTORY OF WEIGHTS */}
                                <div class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm space-y-3">
                                    <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                                        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                                            <i data-lucide="history" class="text-rose-400 w-5 h-5"></i>
                                            История Твоих Побед
                                        </h3>
                                        <button 
                                            onClick={() => {
                                                if (confirm("Точно стереть историю побед?")) {
                                                    setWeightLog([{ date: "27.09", weight: profile.currentWeight }]);
                                                }
                                            }}
                                            class="text-[10px] text-rose-400 hover:text-rose-600 hover:underline"
                                        >
                                            Сбросить историю
                                        </button>
                                    </div>

                                    {/* Weight Table */}
                                    <div class="overflow-hidden border border-slate-100 rounded-xl text-xs">
                                        <div class="bg-slate-50 grid grid-cols-3 font-bold py-2 px-3 border-b border-slate-100 text-slate-600">
                                            <span>Дата</span>
                                            <span class="text-center">Вес (кг)</span>
                                            <span class="text-right">Динамика</span>
                                        </div>
                                        <div class="divide-y divide-slate-100 max-h-40 overflow-y-auto custom-scrollbar">
                                            {weightLog.slice().reverse().map((row, index, arr) => {
                                                // Calculate difference from previous weight (which is next in the reversed array)
                                                const prevRow = arr[index + 1];
                                                let diffText = "—";
                                                let diffClass = "text-slate-400";
                                                
                                                if (prevRow) {
                                                    const diff = row.weight - prevRow.weight;
                                                    if (diff < 0) {
                                                        diffText = `${diff.toFixed(1)} кг ⬇️`;
                                                        diffClass = "text-emerald-600 font-bold";
                                                    } else if (diff > 0) {
                                                        diffText = `+${diff.toFixed(1)} кг ⬆️`;
                                                        diffClass = "text-rose-500 font-medium";
                                                    } else {
                                                        diffText = "0.0 кг ✊";
                                                        diffClass = "text-slate-500";
                                                    }
                                                }

                                                return (
                                                    <div key={index} class="grid grid-cols-3 py-2 px-3 hover:bg-slate-50/50">
                                                        <span class="text-slate-500 font-medium">{row.date}</span>
                                                        <span class="text-center font-bold text-slate-800">{row.weight} кг</span>
                                                        <span class={`text-right ${diffClass}`}>{diffText}</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    
                                    {/* Motivation Card */}
                                    <div class="bg-emerald-50/50 border border-emerald-100 rounded-xl p-3 flex gap-3 items-center">
                                        <span class="text-2xl animate-pulse">🎉</span>
                                        <p class="text-xs text-emerald-900 leading-snug font-medium">
                                            Минус <strong class="text-emerald-600 text-sm font-extrabold">{totalWeightLoss} кг</strong> с начала пути! До заветной цели осталось скинуть всего <strong class="text-rose-500 text-sm font-extrabold">{remainingToTarget} кг</strong>. Любочка гордится тобой неимоверно!
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* MOBILE NAVIGATION BAR (Bottom Sticky) */}
                    <nav class="bg-white border-t border-slate-100 py-2 px-1 rounded-t-2xl shadow-[0_-4px_12px_rgba(0,0,0,0.05)] absolute bottom-0 left-0 right-0 z-10 flex justify-around items-center">
                        <button 
                            onClick={() => setActiveTab('home')}
                            class={`flex flex-col items-center gap-1 py-1 px-3.5 rounded-xl transition ${
                                activeTab === 'home' ? 'text-rose-500 bg-rose-50 font-bold scale-105' : 'text-slate-400 hover:text-slate-600'
                            }`}
                        >
                            <i data-lucide="home" class="w-5 h-5"></i>
                            <span class="text-[9px]">Главная</span>
                        </button>

                        <button 
                            onClick={() => setActiveTab('chat')}
                            class={`flex flex-col items-center gap-1 py-1 px-3.5 rounded-xl transition ${
                                activeTab === 'chat' ? 'text-rose-500 bg-rose-50 font-bold scale-105' : 'text-slate-400 hover:text-slate-600'
                            }`}
                        >
                            <div class="relative">
                                <i data-lucide="message-square" class="w-5 h-5"></i>
                                <span class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white text-[8px] font-bold w-4 h-4 rounded-full flex items-center justify-center">1</span>
                            </div>
                            <span class="text-[9px]">Чат Любочки</span>
                        </button>

                        <button 
                            onClick={() => setActiveTab('analysis')}
                            class={`flex flex-col items-center gap-1 py-1 px-3.5 rounded-xl transition ${
                                activeTab === 'analysis' ? 'text-rose-500 bg-rose-50 font-bold scale-105' : 'text-slate-400 hover:text-slate-600'
                            }`}
                        >
                            <i data-lucide="activity" class="w-5 h-5"></i>
                            <span class="text-[9px]">Анализы</span>
                        </button>

                        <button 
                            onClick={() => setActiveTab('recipes')}
                            class={`flex flex-col items-center gap-1 py-1 px-3.5 rounded-xl transition ${
                                activeTab === 'recipes' ? 'text-rose-500 bg-rose-50 font-bold scale-105' : 'text-slate-400 hover:text-slate-600'
                            }`}
                        >
                            <i data-lucide="soup" class="w-5 h-5"></i>
                            <span class="text-[9px]">Рецепты</span>
                        </button>

                        <button 
                            onClick={() => setActiveTab('profile')}
                            class={`flex flex-col items-center gap-1 py-1 px-3.5 rounded-xl transition ${
                                activeTab === 'profile' ? 'text-rose-500 bg-rose-50 font-bold scale-105' : 'text-slate-400 hover:text-slate-600'
                            }`}
                        >
                            <i data-lucide="user" class="w-5 h-5"></i>
                            <span class="text-[9px]">Кабинет</span>
                        </button>
                    </nav>

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

        // Refresh icons whenever DOM content changes
        setInterval(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 1000);
    </script>
</body>
</html>
